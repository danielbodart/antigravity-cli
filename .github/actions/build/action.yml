name: Build and smoke-test
description: >-
  Build antigravity-cli for one system, then run the result. Shared by the CI
  workflow and by the verification stages of the Upstream and Weekly update
  workflows, so that what lands on trunk is checked exactly the way a pull
  request is.

inputs:
  system:
    description: Nix system double, used only in log output.
    required: true
  cachix-auth-token:
    description: >-
      Write token for the danielbodart Cachix cache. Optional: without one the
      build still runs, it just is not pushed anywhere. CI passes it only on
      trunk.
    required: false
    default: ""
  github-token:
    description: Token for Nix's GitHub API access, to avoid rate limits.
    required: true

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ inputs.github-token }}

    # Pulls only: what is pushed is named below.
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: danielbodart
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: true

    - name: nix flake check
      shell: bash
      run: nix flake check --print-build-logs

    - name: Build
      shell: bash
      run: nix build .#antigravity-cli --print-build-logs --out-link result

    # The build's installCheck already ran this, but it ran in a sandbox. This
    # runs the installed binary on the runner, and checks that what it reports
    # is what sources.json says it pinned: a pin that names one release and
    # fetches another fails here.
    - name: Run the packaged binary
      shell: bash
      run: |
        version="$(./result/bin/agy --version)"
        expected="$(jq -r .version sources.json)"
        echo "agy reported $version on ${{ inputs.system }}"
        [ "$version" = "$expected" ] || {
          echo "expected $expected" >&2
          exit 1
        }

    # The package output and its closure, and nothing else: not the checks'
    # builds (the cache's 5 GB free tier).
    - name: Push the package to Cachix
      if: inputs.cachix-auth-token != ''
      shell: bash
      run: nix build --print-out-paths .#antigravity-cli | cachix push danielbodart

    - name: Report closure size
      shell: bash
      run: nix path-info --closure-size --human-readable ./result
